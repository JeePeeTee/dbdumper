name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # The tool is Windows-first in practice, but nothing in it is
    # Windows-only, so both are built to keep it that way.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The integration tests skip themselves unless DBDUMPER_TEST_DSN points
      # at a SQL Server the runner may create databases on, so this is the unit
      # suite only. Run the race detector locally with a DSN set: that is where
      # the parallel table loading is actually exercised.
      - name: Test
        run: go test ./...
